<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confession</title>
  <link rel="stylesheet" href="/css/header.css"> <!-- Đường dẫn tùy thuộc vào cấu trúc dự án của bạn -->
</head>
<body>
<header th:fragment="header" class="header-main">
  <div class="header-container">
    <div class="header-left">
      <a class="header-logo" th:href="@{/posts}">
        <img alt="Speech bubble icon representing anonymous confession" class="header-logo-img" height="24"
             src="https://storage.googleapis.com/a1aa/image/218d3c19-6273-411d-4e5a-fb1f9780e8f9.jpg"
             width="24"/>
        <span class="header-logo-title">CONFESSION</span>
        <span class="header-logo-subtitle">ANONYMOUS</span>
      </a>
      <nav class="header-nav">
        <a class="header-nav-item header-nav-home" th:href="@{/posts}">HOME</a>
        <a class="header-nav-item" href="#">SITE RULES</a>
        <a class="header-nav-item" href="#">CONTACT US</a>
      </nav>
    </div>
    <div class="header-social">
      <a aria-label="Twitter" class="header-social-icon" href="#"><i class="fab fa-twitter fa-lg"></i></a>
      <a aria-label="Instagram" class="header-social-icon" href="#"><i class="fab fa-instagram fa-lg"></i></a>
      <a aria-label="Facebook" class="header-social-icon" href="#"><i class="fab fa-facebook-f fa-lg"></i></a>
      <form class="header-search-form" th:action="@{/posts/search}" method="post">
        <input th:name="keyword" class="header-search-input" placeholder="Search post by title …" type="search" aria-label="Search"/>
        <button type="submit" aria-label="Search button" class="header-search-button">
          <i class="fas fa-search"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Subnav -->
  <nav class="header-subnav" aria-label="Secondary navigation">
    <a class="header-subnav-item" th:href="@{/categories/Business}">Business</a>
    <a class="header-subnav-item" th:href="@{/categories/Crime}">Crime</a>
    <a class="header-subnav-item" th:href="@{/categories/Family}">Family</a>
    <a class="header-subnav-item" th:href="@{/categories/Friend}">Friend</a>
    <a class="header-subnav-item" th:href="@{/categories/Job}">Job</a>
    <a class="header-subnav-item" th:href="@{/categories/Life}">Life</a>
    <a class="header-subnav-item" th:href="@{/categories/Parent}">Parent</a>
    <a class="header-subnav-item" th:href="@{/categories/Pet}">Pet</a>
    <a class="header-subnav-item" th:href="@{/categories/Relationship}">Relationship</a>
    <div class="header-subnav-dropdown">
      <button class="header-subnav-dropdown-btn" aria-expanded="false" aria-haspopup="true">
        <span>School</span>
        <i class="fas fa-caret-down text-xs"></i>
      </button>
    </div>
    <a class="header-subnav-item" th:href="@{/categories/Television}">Television</a>
    <a class="header-subnav-item" th:href="@{/categories/Vacation}">Vacation</a>
    <a class="header-subnav-item" th:href="@{/categories/Uncategorized}">Uncategorized</a>
    <button aria-label="Toggle dark mode" class="header-darkmode-toggle">
      <i class="fas fa-moon"></i>
    </button>
    <a th:href="@{/posts/create}" class="header-add-post-btn">
      ADD CONFESSION
    </a>
  </nav>
</header>
</body>
</html>
