<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Confession</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/index.css"/>
    <link rel="stylesheet" href="/css/post.css"/>

    <!-- Font + Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
</head>
<body>

<!-- Top Nav -->
<div th:replace="~{/fragments/header :: header}"></div>

<main class="container">
    <!-- Left content -->
    <section class="section-left">
        <!-- Tabs -->
        <nav class="nav-tabs" id="post-tabs">
            <a th:href="@{/posts}" data-sort="new"
               th:classappend="${sort == 'new'} ? ' active' : ''">NEW</a>
            <a th:href="@{/posts}" data-sort="hot"
               th:classappend="${sort == 'hot'} ? ' active' : ''">HOT</a>
            <a th:href="@{/posts}" data-sort="popular"
               th:classappend="${sort == 'popular'} ? ' active' : ''">POPULAR</a>
            <a th:href="@{/posts}" data-sort="trending"
               th:classappend="${sort == 'trending'} ? ' active' : ''">TRENDING</a>
        </nav>

        <!-- Danh sách bài viết -->
        <div id="posts-container" th:replace="~{/fragments/postsList :: postsList}"></div>

        <script src="/static/js/posts.js"></script>
    </section>

    <!-- Right sidebar -->
    <aside class="sidebar">
        <h3>TAGGED CONFESSIONS</h3>
        <div class="sidebar-tags">
            <span th:each="tag : ${tags}" class="sidebar-tag" th:text="'# ' + ${tag.tagName}"></span>
        </div>
    </aside>
</main>

</body>
</html>
