plugins {
  id 'java'
  id 'war'
}

group 'khucnhan.project'
version '1.0-SNAPSHOT'

repositories {
  mavenCentral()
}

ext {
  junitVersion = '5.9.2'
}

sourceCompatibility = "14"
targetCompatibility = "14"

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

dependencies {
  compileOnly('javax.servlet:javax.servlet-api:4.0.1')

  testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
  testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
  testImplementation("org.slf4j:slf4j-simple:1.7.25")

  implementation(group: 'org.springframework', name: 'spring-webmvc', version: '5.0.1.RELEASE')
  implementation("nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.0.0")
  implementation("org.thymeleaf:thymeleaf-spring5:3.0.15.RELEASE")
  implementation("org.hibernate:hibernate-core:5.6.15.Final")
  implementation("org.springframework.data:spring-data-jpa:2.5.3")
  implementation 'mysql:mysql-connector-java:8.0.33'
}

test {
useJUnitPlatform()}